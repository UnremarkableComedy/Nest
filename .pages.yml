media:
  - name: images
    label: Images
    input: public/uploads
    output: /uploads
    rename: safe
    categories: [image]

content:
  - name: site
    label: Site Settings
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: name
        label: Performer Name
        type: string
        required: true

      - name: firstName
        label: First Name
        type: string
        required: true

      - name: lastName
        label: Last Name
        type: string
        required: true

      - name: tagline
        label: Tagline
        type: string

      - name: email
        label: Display Email
        type: string
        description: Optional public-facing email for the site. Contact form delivery uses server environment variables, not this field.

      - name: seo
        label: SEO
        type: object
        fields:
          - name: title
            label: Page Title
            type: string
            required: true

          - name: description
            label: Meta Description
            type: text
            required: true

      - name: images
        label: Images
        type: object
        fields:
          - name: headshot
            label: Hero Headshot
            type: object
            fields:
              - name: src
                label: Image
                type: image
                options:
                  media: images
                  extensions: [jpg, jpeg, png, webp]

              - name: alt
                label: Alt Text
                type: string
                description: Briefly describe the image for accessibility.

          - name: about
            label: About Photo
            type: object
            fields:
              - name: src
                label: Image
                type: image
                options:
                  media: images
                  extensions: [jpg, jpeg, png, webp]

              - name: alt
                label: Alt Text
                type: string
                description: Briefly describe the image for accessibility.

      - name: social
        label: Social Links
        type: object
        fields:
          - name: instagram
            label: Instagram
            type: string

          - name: facebook
            label: Facebook
            type: string

          - name: x
            label: X
            type: string

          - name: threads
            label: Threads
            type: string

          - name: youtube
            label: YouTube
            type: string

          - name: tiktok
            label: TikTok
            type: string

      - name: sections
        label: Section Text
        type: object
        fields:
          - name: hero
            label: Hero
            type: object
            fields:
              - name: followLabel
                label: Follow Label
                type: string

          - name: about
            label: About
            type: object
            fields:
              - name: eyebrow
                label: Section Label
                type: string

              - name: headline
                label: Headline
                type: string

              - name: photoCaption
                label: Photo Caption
                type: string

              - name: pullQuote
                label: Pull Quote
                type: text

              - name: pullQuoteAttribution
                label: Pull Quote Attribution
                type: string

          - name: shows
            label: Shows
            type: object
            fields:
              - name: eyebrow
                label: Section Label
                type: string

              - name: headline
                label: Headline
                type: string

              - name: moreDates
                label: More Dates Note
                type: string
                description: Short note under the show list (e.g. more dates to be announced).

          - name: videos
            label: Videos
            type: object
            fields:
              - name: eyebrow
                label: Section Label
                type: string

              - name: headline
                label: Headline
                type: string

              - name: featuredLabel
                label: Featured Label
                type: string

              - name: moreLabel
                label: More Videos Label
                type: string

          - name: contact
            label: Contact
            type: object
            fields:
              - name: eyebrow
                label: Section Label
                type: string

              - name: headline
                label: Headline
                type: string

              - name: blurb
                label: Intro Text
                type: text

              - name: success
                label: Success Message
                type: text

  - name: bio
    label: Bio
    type: file
    path: content/bio.md
    format: raw
    operations:
      delete: false

  - name: shows
    label: Shows
    type: file
    path: content/shows.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: id
        type: string
        hidden: true

      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: time
        label: Time
        type: string
        required: true
        description: "Example: 8:00 PM"

      - name: city
        label: City
        type: string
        required: true

      - name: state
        label: State
        type: string
        required: true

      - name: venue
        label: Venue
        type: string
        required: true

      - name: ticketUrl
        label: Ticket Link
        type: string

      - name: status
        label: Status
        type: select
        description: Choose "No Status" to remove the tag from this show.
        options:
          placeholder: No Status
          values:
            - name: ""
              label: No Status
            - Sold Out
            - Low Tickets
            - Added Show
            - New

      - name: detail
        label: Additional Details
        type: text

  - name: videos
    label: Videos
    type: file
    path: content/videos.json
    format: json
    operations:
      delete: false
    fields:
      - name: featured
        label: Featured Video
        type: object
        fields:
          - name: id
            type: string
            hidden: true

          - name: title
            label: Title
            type: string
            required: true

          - name: youtubeUrl
            label: YouTube URL
            type: string
            required: true

          - name: description
            label: Description
            type: text

      - name: additional
        label: Additional Videos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: id
            type: string
            hidden: true

          - name: title
            label: Title
            type: string
            required: true

          - name: youtubeUrl
            label: YouTube URL
            type: string
            required: true

          - name: description
            label: Description
            type: text

settings:
  hide: true
